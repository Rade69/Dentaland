<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Desktop fit test</title></head><body>
<h1 id="result">RUNNING</h1><pre id="details"></pre><iframe id="app" src="../index.html" width="1366" height="768"></iframe>
<script>document.querySelector("#app").addEventListener("load",()=>{const frame=document.querySelector("#app"),doc=frame.contentDocument,win=frame.contentWindow,panels=[...doc.querySelectorAll(".panel")],footer=doc.querySelector("footer");win.scrollTo(0,100);const scrollBlocked=win.scrollY===0&&win.getComputedStyle(doc.body).overflowY==="hidden";const panelsFit=panels.every(panel=>{const bottom=panel.getBoundingClientRect().bottom;return [...panel.querySelectorAll("*")].every(child=>child.getBoundingClientRect().bottom<=bottom+.5)});const mobileRuleInactive=panels.every(panel=>win.getComputedStyle(panel).display!=="none");const footerVisible=win.getComputedStyle(footer).display!=="none"&&footer.getBoundingClientRect().bottom<=doc.documentElement.clientHeight;const rows=[`viewport: ${doc.documentElement.clientWidth}x${doc.documentElement.clientHeight}`,`scroll-blocked: ${scrollBlocked}`,`all-panel-content-visible: ${panelsFit}`,`visible-panels: ${mobileRuleInactive}`,`footer-visible: ${footerVisible}`];document.querySelector("#result").textContent=scrollBlocked&&panelsFit&&mobileRuleInactive&&footerVisible?"PASS":"FAIL";document.querySelector("#details").textContent=rows.join("\n")})</script>
</body></html>

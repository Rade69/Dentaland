<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Desktop wizard layout test</title></head><body>
<h1 id="result">RUNNING</h1><pre id="details"></pre><iframe id="app" src="../index.html" width="1366" height="768"></iframe>
<script>document.querySelector("#app").addEventListener("load",()=>{const frame=document.querySelector("#app"),doc=frame.contentDocument,win=frame.contentWindow,panels=[...doc.querySelectorAll(".panel")],visible=panels.filter(panel=>win.getComputedStyle(panel).display!=="none"),benefits=doc.querySelector(".benefits").getBoundingClientRect(),footer=doc.querySelector(".site-footer").getBoundingClientRect(),root=doc.documentElement,noHorizontalScroll=root.scrollWidth===root.clientWidth,noVerticalScroll=root.scrollHeight===root.clientHeight&&win.getComputedStyle(doc.body).overflowY==="hidden",cardsBeforeBenefits=panels.every(panel=>panel.getBoundingClientRect().bottom<=benefits.top+1),footerGap=footer.top-benefits.bottom,footerFollowsContent=footerGap<=18,allInViewport=footer.bottom<=root.clientHeight+1;const checks=[visible.length===3,noHorizontalScroll,noVerticalScroll,cardsBeforeBenefits,footerFollowsContent,allInViewport,!doc.body.textContent.includes("Login")];const rows=[`visible-panels: ${visible.map(panel=>panel.dataset.panel).join(",")}`,`viewport: ${root.clientWidth}x${root.clientHeight}`,`document: ${root.scrollWidth}x${root.scrollHeight}`,`no-horizontal-scroll: ${noHorizontalScroll}`,`no-vertical-scroll: ${noVerticalScroll}`,`cards-before-benefits: ${cardsBeforeBenefits}`,`benefits-to-footer-gap: ${footerGap}`,`footer-follows-content: ${footerFollowsContent}`,`footer-in-viewport: ${allInViewport}`,`login-absent: ${!doc.body.textContent.includes("Login")}`];document.querySelector("#result").textContent=checks.every(Boolean)?"PASS":"FAIL";document.querySelector("#details").textContent=rows.join("\n")})</script>
</body></html>

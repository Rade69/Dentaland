<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Mobile width test</title></head><body>
<h1 id="result">RUNNING</h1><pre id="details"></pre><iframe id="app" src="../index.html" width="390" height="844"></iframe>
<script>document.querySelector("#app").addEventListener("load",()=>{const frame=document.querySelector("#app"),doc=frame.contentDocument,win=frame.contentWindow;const selectors=["html","body",".site-header",".page-shell",".stepper",".panels",".panel.is-current",".calendar",".weekday-row",".calendar-grid"];const rows=selectors.map(selector=>{const element=doc.querySelector(selector);return `${selector}: client=${element.clientWidth}, scroll=${element.scrollWidth}`});const contact=doc.querySelector(".header-contact").getBoundingClientRect();const panels=[...doc.querySelectorAll("[data-panel]")].filter(panel=>win.getComputedStyle(panel).display!=="none");const checks=[doc.documentElement.scrollWidth===doc.documentElement.clientWidth,contact.right<=doc.documentElement.clientWidth,doc.querySelectorAll(".weekday-row span").length===5,panels.length===1&&panels[0].dataset.panel==="1",win.getComputedStyle(doc.querySelector(".desktop-nav")).display==="none",!doc.body.textContent.includes("Login")];rows.push(`phone-visible: ${contact.right<=doc.documentElement.clientWidth}`,`weekday-columns: ${doc.querySelectorAll(".weekday-row span").length}`,`visible-panels: ${panels.map(panel=>panel.dataset.panel).join(",")}`,`desktop-nav-hidden: ${win.getComputedStyle(doc.querySelector(".desktop-nav")).display==="none"}`,`login-absent: ${!doc.body.textContent.includes("Login")}`);document.querySelector("#result").textContent=checks.every(Boolean)?"PASS":"FAIL";document.querySelector("#details").textContent=rows.join("\n")})</script>
</body></html>

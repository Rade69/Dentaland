<!doctype html>
<html lang="bs">
<head><meta charset="utf-8"><title>DENT-013 privacy page test</title></head>
<body>
  <h1 id="result">RUNNING</h1>
  <pre id="details"></pre>
  <iframe id="booking" src="../index.html" width="1200" height="900"></iframe>
  <iframe id="privacy" src="../privacy.html" width="1200" height="900"></iframe>
  <script>
    const checks = [];
    const assert = (condition, message) => { if (!condition) throw new Error(message); checks.push(`PASS: ${message}`); };
    let loaded = 0;
    const run = () => {
      loaded += 1;
      if (loaded < 2) return;
      try {
        const booking = document.querySelector("#booking").contentDocument;
        const privacy = document.querySelector("#privacy").contentDocument;
        const noticeLinks = [...booking.querySelectorAll('a[href="privacy.html"]')];
        assert(noticeLinks.length === 2, "forma sadrži dva ispravna linka ka privacy stranici");
        assert(noticeLinks.every(link => link.target === "_blank" && link.rel.includes("noopener")), "privacy linkovi se bezbjedno otvaraju u novom tabu");
        assert(!booking.body.textContent.includes("Ne dijelimo ih sa trećim stranama"), "uklonjena je netačna apsolutna tvrdnja o trećim stranama");
        assert(!booking.querySelector(".consent-row").textContent.includes("pristajem na obradu"), "checkbox je potvrda upoznavanja, ne univerzalna saglasnost");
        assert(privacy.querySelectorAll(".privacy-content section").length === 12, "obavještenje sadrži svih 12 sekcija");
        assert(privacy.body.textContent.includes("pet godina od posljednjeg unosa"), "naveden je rok evidencije zakazivanja");
        assert(privacy.body.textContent.includes("Ne unosite medicinske podatke") || privacy.body.textContent.includes("ne unosite zdravstvene podatke"), "stranica upozorava da se ne unose medicinski podaci");
        assert(Boolean(privacy.querySelector('a[href="index.html"]')), "stranica ima povratak na zakazivanje");
        document.querySelector("#result").textContent = "PASS";
        document.querySelector("#details").textContent = checks.join("\n");
      } catch (error) {
        document.querySelector("#result").textContent = "FAIL";
        document.querySelector("#details").textContent = `${checks.join("\n")}\n${error.stack}`;
      }
    };
    document.querySelector("#booking").addEventListener("load", run);
    document.querySelector("#privacy").addEventListener("load", run);
  </script>
</body>
</html>

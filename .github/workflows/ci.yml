name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "SQLAlchemy>=2.0" \
            "alembic>=1.13" \
            "tzdata>=2024.1" \
            "PySide6>=6.7" \
            "cryptography>=42.0" \
            "fastapi>=0.115" \
            "uvicorn>=0.30" \
            "slowapi>=0.1.9" \
            "psycopg2-binary>=2.9" \
            "argon2-cffi>=23.1" \
            "pytest>=8.0" \
            "ruff>=0.6" \
            "mypy>=1.14" \
            "pytest-qt>=4.4" \
            "httpx>=0.27"

      - name: Run pytest
        run: pytest tests/ -q

      - name: Run ruff
        run: ruff check src/dentaland desktop backend tests

      - name: Run mypy
        run: mypy src/dentaland desktop backend

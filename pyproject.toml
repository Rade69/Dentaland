[project]
name = "dentaland"
version = "0.0.0"
description = "Sistem zakazivanja termina za Dentaland — Faza 0: PySide6 + SQLite desktop aplikacija."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "tzdata>=2024.1",
    "PySide6>=6.7",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.14",
    "pytest-qt>=4.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = false
warn_redundant_casts = true
disallow_untyped_defs = true
